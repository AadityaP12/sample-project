name: HTML CI

on:
  push:
    branches: 
      - main
      - feature/**
  
  pull_request:
    branches:
      - main

jobs:
  validate-html:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          test -f index.html
          test -s index.html
          echo "HTML exists"

      - name: Build Docker Image
        run: docker build -t my-html-app

      - name: Run Docker Container
        run: docker run -d -p 8080:80 my-html-app
      
      - name: Check Running Container
        run: docker ps

      - name: Success Message
        run: echo "Successful"


